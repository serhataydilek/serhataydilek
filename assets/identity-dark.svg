<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-label="Serhat wireframe identity">
  <title>serhat@github</title>

  <!-- wireframe cube -->
  <g transform="translate(64 52)" fill="none" stroke="#4ade80" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round">
    <g>
      <animateTransform attributeName="transform" type="rotate" values="0;12;0;-12;0" dur="9s" repeatCount="indefinite"/>
      <path d="M-18 -8 L2 -18 L22 -8 L2 2 Z" stroke-opacity="0.35"/>
      <path d="M-22 4 L-2 -6 L18 4 L-2 14 Z" stroke-opacity="0.95"/>
      <path d="M-18 -8 L-22 4" stroke-opacity="0.55"/>
      <path d="M2 -18 L-2 -6" stroke-opacity="0.55"/>
      <path d="M22 -8 L18 4" stroke-opacity="0.55"/>
      <path d="M2 2 L-2 14" stroke-opacity="0.55"/>
      <path d="M-22 4 L18 4" stroke-opacity="0.22"/>
      <path d="M-2 -6 L-2 14" stroke-opacity="0.22"/>
    </g>
  </g>

  <!-- point cloud -->
  <g fill="#6ee7a8">
    <circle cx="38" cy="34" r="1.3"><animate attributeName="opacity" values="0.25;0.95;0.25" dur="3.1s" begin="0s" repeatCount="indefinite"/></circle>
    <circle cx="78" cy="28" r="1.2"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="2.7s" begin="0.5s" repeatCount="indefinite"/></circle>
    <circle cx="90" cy="52" r="1.3"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.4s" begin="0.9s" repeatCount="indefinite"/></circle>
    <circle cx="42" cy="68" r="1.1"><animate attributeName="opacity" values="0.2;0.85;0.2" dur="2.9s" begin="1.2s" repeatCount="indefinite"/></circle>
    <circle cx="70" cy="62" r="1.2"><animate attributeName="opacity" values="0.25;0.9;0.25" dur="3.2s" begin="0.3s" repeatCount="indefinite"/></circle>
    <circle cx="56" cy="40" r="1.0"><animate attributeName="opacity" values="0.15;0.75;0.15" dur="2.5s" begin="1.6s" repeatCount="indefinite"/></circle>
    <circle cx="84" cy="72" r="1.1"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="3.0s" begin="0.7s" repeatCount="indefinite"/></circle>
  </g>

  <!-- identity label -->
  <text x="64" y="108" text-anchor="middle" fill="#86efac" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10">serhat@github</text>
  <rect x="104" y="100" width="4" height="8" fill="#6ee7a8">
    <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>
</svg>

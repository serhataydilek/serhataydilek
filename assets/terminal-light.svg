<svg xmlns="http://www.w3.org/2000/svg" width="176" height="120" viewBox="0 0 176 120" role="img" aria-label="serhat@github mini TUI">
  <title>serhat@github</title>
  <rect width="176" height="120" rx="4" fill="#f4f4f4" stroke="#cfcfcf"/>

  <!-- left: isometric wireframe cube + point cloud -->
  <g transform="translate(8,18)" fill="none" stroke="#15803d" stroke-width="1">
    <g>
      <animateTransform attributeName="transform" type="rotate" values="0 30 42;8 30 42;0 30 42;-8 30 42;0 30 42" dur="8s" repeatCount="indefinite"/>
      <!-- back face -->
      <path d="M18 22 L42 14 L54 30 L30 38 Z" stroke-opacity="0.3"/>
      <!-- front face -->
      <path d="M10 34 L34 26 L46 42 L22 50 Z" stroke-opacity="0.9"/>
      <!-- connecting edges -->
      <path d="M18 22 L10 34" stroke-opacity="0.55"/>
      <path d="M42 14 L34 26" stroke-opacity="0.55"/>
      <path d="M54 30 L46 42" stroke-opacity="0.55"/>
      <path d="M30 38 L22 50" stroke-opacity="0.55"/>
      <!-- diagonals for structure -->
      <path d="M10 34 L46 42" stroke-opacity="0.18"/>
      <path d="M34 26 L22 50" stroke-opacity="0.18"/>
    </g>
    <!-- point cloud -->
    <g fill="#166534" stroke="none">
      <circle cx="16" cy="28" r="1.2"><animate attributeName="opacity" values="0.25;0.9;0.25" dur="3.2s" begin="0s" repeatCount="indefinite"/></circle>
      <circle cx="40" cy="20" r="1.1"><animate attributeName="opacity" values="0.2;0.85;0.2" dur="2.8s" begin="0.4s" repeatCount="indefinite"/></circle>
      <circle cx="48" cy="36" r="1.2"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.6s" begin="0.8s" repeatCount="indefinite"/></circle>
      <circle cx="24" cy="46" r="1.0"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="2.6s" begin="1.1s" repeatCount="indefinite"/></circle>
      <circle cx="36" cy="40" r="1.1"><animate attributeName="opacity" values="0.25;0.95;0.25" dur="3.0s" begin="0.2s" repeatCount="indefinite"/></circle>
      <circle cx="28" cy="24" r="0.9"><animate attributeName="opacity" values="0.15;0.7;0.15" dur="2.4s" begin="1.5s" repeatCount="indefinite"/></circle>
      <circle cx="44" cy="48" r="1.0"><animate attributeName="opacity" values="0.2;0.75;0.2" dur="3.4s" begin="0.6s" repeatCount="indefinite"/></circle>
    </g>
  </g>

  <!-- divider -->
  <line x1="68" y1="14" x2="68" y2="106" stroke="#d4d4d4" stroke-width="1"/>

  <!-- right: identity output -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="78" y="22" fill="#6b6b6b" font-size="9">serhat@github</text>

    <text x="78" y="40" fill="#8a8a8a" font-size="9">$ whoami</text>
    <text x="78" y="52" fill="#166534" font-size="10">serhat</text>

    <text x="78" y="68" fill="#8a8a8a" font-size="9">$ building</text>
    <text x="78" y="80" fill="#15803d" font-size="10">structura-ai</text>

    <text x="78" y="96" fill="#8a8a8a" font-size="9">$ focus</text>
    <text x="78" y="108" fill="#14532d" font-size="9">web / cv / security</text>
    <rect x="160" y="100" width="5" height="9" fill="#15803d">
      <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
